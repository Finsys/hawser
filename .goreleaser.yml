version: 2

project_name: hawser

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/hawser
    binary: hawser
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
    goarm:
      - "7"
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.ShortCommit}}
    flags:
      - -trimpath

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - README.md
      - LICENSE
      - scripts/install.sh
      - scripts/hawser.service

dockers:
  - image_templates:
      - "ghcr.io/finsys/hawser:{{ .Version }}-amd64"
      - "ghcr.io/finsys/hawser:latest-amd64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    goarch: amd64
    dockerfile: Dockerfile

  - image_templates:
      - "ghcr.io/finsys/hawser:{{ .Version }}-arm64"
      - "ghcr.io/finsys/hawser:latest-arm64"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    goarch: arm64
    dockerfile: Dockerfile

  - image_templates:
      - "ghcr.io/finsys/hawser:{{ .Version }}-armv7"
      - "ghcr.io/finsys/hawser:latest-armv7"
    use: buildx
    build_flag_templates:
      - "--platform=linux/arm/v7"
      - "--label=org.opencontainers.image.title={{ .ProjectName }}"
      - "--label=org.opencontainers.image.version={{ .Version }}"
      - "--label=org.opencontainers.image.source={{ .GitURL }}"
      - "--label=org.opencontainers.image.revision={{ .FullCommit }}"
    goarch: arm
    goarm: "7"
    dockerfile: Dockerfile.armv7

docker_manifests:
  - name_template: "ghcr.io/finsys/hawser:{{ .Version }}"
    image_templates:
      - "ghcr.io/finsys/hawser:{{ .Version }}-amd64"
      - "ghcr.io/finsys/hawser:{{ .Version }}-arm64"
      - "ghcr.io/finsys/hawser:{{ .Version }}-armv7"

  - name_template: "ghcr.io/finsys/hawser:latest"
    image_templates:
      - "ghcr.io/finsys/hawser:latest-amd64"
      - "ghcr.io/finsys/hawser:latest-arm64"
      - "ghcr.io/finsys/hawser:latest-armv7"

nfpms:
  - id: hawser
    package_name: hawser
    description: |-
      Remote Docker agent for Dockhand
      Hawser lets a Dockhand server manage remote Docker hosts over HTTP or
      outbound WebSocket connections.
    maintainer: Finsys / Jarek Krochmalski <support@dockhand.pro>
    section: net
    homepage: https://dockhand.pro/
    ids:
      - hawser
    formats:
      - deb
    dependencies:
      - docker-ce
      - libc6
    contents:
      - src: ./debian/hawser.service
        dst: /usr/lib/systemd/system/hawser.service
        packager: deb
      - src: ./debian/copyright
        dst: /usr/share/doc/hawser/copyright
        packager: deb
    scripts:
      postinstall: ./debian/postinstall.sh
      preremove: ./debian/prerm.sh
      postremove: ./debian/postrm.sh
    deb:
      predepends:
        - adduser
        - debconf
      scripts:
        templates: ./debian/templates
        config: ./debian/config.sh
      lintian_overrides:
        # Go release binaries are intentionally self-contained.
        - statically-linked-binary
        # A Debian changelog has not been written yet.
        - no-changelog
        # A manpage has not been written yet.
        - no-manual-page
        # GoReleaser 2.17 emits this field but cannot currently disable it.
        - unknown-field Architecture-Variant

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: Finsys
    name: hawser
  prerelease: auto
  draft: true
  name_template: "v{{ .Version }}"
