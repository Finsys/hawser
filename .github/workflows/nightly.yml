name: Nightly

# Rebuilds and re-pushes the ghcr.io images for the latest release tag every
# night. The final image is FROM scratch with a Wolfi rootfs generated by apko
# (amd64/arm64) or apk-installed Alpine packages (armv7) at build time, so
# scanner findings with an upstream fix only disappear once the image is
# rebuilt. Same goreleaser flow as the Release workflow, minus the GitHub
# release itself.

on:
  schedule:
    # 04:17 UTC daily (off-peak, avoids the top-of-hour runner crush)
    - cron: "17 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

concurrency:
  group: nightly-image
  cancel-in-progress: true

jobs:
  rebuild:
    # Forks cannot push to ghcr.io/finsys with their GITHUB_TOKEN, and their
    # schedules are disabled by default anyway; keep this upstream-only.
    if: github.repository == 'Finsys/hawser'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out latest release tag
        # Rebuild the newest tagged release, not main: the pushed :<version>
        # and :latest tags must keep matching the published release binary.
        run: git checkout "$(git describe --tags --abbrev=0)"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27"

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        # --skip=release: push the images/checksums again for the existing tag
        # but do not touch the GitHub release. Fresh runner + no registry
        # layer cache means apko/apk fetch the newest Wolfi/Alpine package
        # revisions every night.
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --skip=release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
