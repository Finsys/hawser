# Debian-specific overrides for the shared hawser.service unit.
[Service]
# The package installs the binary in /usr/bin rather than /usr/local/bin.
ExecStart=
ExecStart=/usr/bin/hawser

# Debian uses /run for state files, not /var/run.
ReadWritePaths=
ReadWritePaths=/run/docker.sock

# Docker socket access comes from the hawser user's docker group membership,
# set up by the package's postinst.
User=hawser
Group=hawser

# /var/lib/hawser is the hawser user's home, holding Docker CLI state such as
# registry logins, and STACKS_DIR (/var/lib/hawser/stacks).
StateDirectory=hawser hawser/stacks
StateDirectoryMode=0750
